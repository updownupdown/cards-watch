# The unit tests (rules, card movement, scrolling) and the screenshots of
# every screen, on each push and pull request. The screenshots are kept as an
# artifact to look through, and the Play listing's Wear screenshots as another.
name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric's Android jars, fetched on first use.
      - uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Unit tests and screenshots
        run: ./gradlew --console=plain recordRoborazziDebug

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: app/build/outputs/roborazzi
          if-no-files-found: ignore

      - name: Store screenshots
        uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: app/build/outputs/store
          if-no-files-found: ignore

      - name: Test report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: app/build/reports/tests
