# Measures the baseline profile on a Wear OS emulator and opens a pull
# request with it. Run it by hand (Actions → Baseline profile → Run workflow)
# after a change to the home screen or a game's board, before a release.
name: Baseline profile

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  profile:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Android SDK platform
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Allow the emulator to use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Measure on a large round watch
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: android-wear
          arch: x86_64
          profile: wearos_large_round
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew --console=plain :app:generateBaselineProfile

      - name: The profile
        uses: actions/upload-artifact@v4
        with:
          name: baseline-profile
          path: app/src/main/generated/baselineProfiles

      - name: Pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: baseline-profile
          commit-message: Regenerate the baseline profile
          title: Regenerate the baseline profile
          body: Measured on a Wear OS emulator (API 34, large round) by the Baseline profile workflow.
          add-paths: app/src/main/generated/baselineProfiles
